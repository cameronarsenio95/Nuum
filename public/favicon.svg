<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="90" fill="#1F2024"/>

  <!-- NUUM Mark Logo - Centered circle with horizontal lines -->
  <g transform="translate(256, 256)">
    <!-- Main circle outline -->
    <circle cx="0" cy="-20" r="130" fill="#EFEFEF" stroke="none"/>

    <!-- Top horizontal line (thickest) -->
    <rect x="-120" y="60" width="240" height="26" rx="13" fill="#1F2024"/>

    <!-- Middle horizontal line -->
    <rect x="-120" y="100" width="240" height="26" rx="13" fill="#1F2024"/>

    <!-- Bottom horizontal line (slightly thinner) -->
    <rect x="-100" y="140" width="200" height="22" rx="11" fill="#1F2024"/>
  </g>
</svg>
